name: Build Atreus Firmware

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYBOARD: keyboardio/atreus   # キーボード名
      KEYMAP: my_atreus             # キーマップ名

    steps:
      # QMK本体をチェックアウト
      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: true

      # 依存パッケージをインストール
      - name: Install QMK dependencies
        run: |
          ./util/qmk_install.sh

      # ファームウェアをビルド
      - name: Compile Atreus Firmware
        run: |
          qmk compile -kb "$KEYBOARD" -km "$KEYMAP"

      # 生成されたHEXファイルをArtifactsとして保存
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atreus_${{ env.KEYMAP }}_firmware
          path: ./.build/*.hex
