name: Build Atreus Firmware

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYBOARD: keyboardio/atreus   # キーボード名
      KEYMAP: my_atreus             # キーマップ名

    steps:
      # このリポジトリ（qmk_for_atreus）をチェックアウト
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      # QMK CLI をインストールして PATH に通す
      - name: Install QMK CLI
        run: |
          python3 -m pip install --user qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          qmk --version

      # このリポジトリを QMK_HOME としてセット
      - name: Configure QMK home
        run: |
          qmk config user.qmk_home="$GITHUB_WORKSPACE"
          qmk doctor || true

      # ファームウェアをビルド
      - name: Compile Atreus Firmware
        run: |
          qmk compile -kb "$KEYBOARD" -km "$KEYMAP"

      # 生成された HEX を artifacts にアップロード
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atreus_${{ env.KEYMAP }}_firmware
          path: ./.build/*.hex
