name: Build Atreus Vial Firmware

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # このリポジトリ（キー定義だけ入っているリポジトリ）をチェックアウト
      - name: Checkout keymap repo
        uses: actions/checkout@v4

      # AVR 用ツールチェーンをインストール（Atreus は ATmega32U4）
      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc make git

      # vial-qmk をクローン
      - name: Clone vial-qmk
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          ls -R

      # Atreus 用の vial キーマップフォルダを作成し、このリポジトリのファイルをコピー
      - name: Copy keymap files into vial-qmk
        run: |
          mkdir -p vial-qmk/keyboards/keyboardio/atreus/keymaps/vial
          cp keymap.c  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp config.h  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp rules.mk  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp vial.json vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/

      # ファームをビルド
      - name: Build firmware (keyboardio/atreus:vial)
        run: |
          cd vial-qmk
          make keyboardio/atreus:vial

      # 生成された HEX をアップロード
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboardio_atreus_vial_firmware
          path: |
            vial-qmk/*.hex
            vial-qmk/*.bin
