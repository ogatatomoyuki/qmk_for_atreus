name: Build Atreus Vial Firmware

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout keymap repo
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc make git

      - name: Clone vial-qmk
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
      
      - name: Copy keymap files into vial-qmk
        run: |
          mkdir -p vial-qmk/keyboards/keyboardio/atreus/keymaps/vial
          cp keyboards/keyboardio/atreus/keymaps/default/keymap.c  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp keyboards/keyboardio/atreus/keymaps/default/config.h  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp keyboards/keyboardio/atreus/keymaps/default/rules.mk  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp keyboards/keyboardio/atreus/keymaps/default/vial.json vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/

      - name: Build firmware (keyboardio/atreus:vial)
        run: |
          cd vial-qmk
          make keyboardio/atreus:vial

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboardio_atreus_vial_firmware
          path: |
            vial-qmk/*.hex
            vial-qmk/*.bin
