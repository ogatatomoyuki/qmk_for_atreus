name: Build Atreus Vial Firmware (official vial-qmk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # このリポジトリを取得（config.h / rules.mk / keymap.c / vial.json用）
      - name: Checkout keymap repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-avr binutils-avr avr-libc make git python3 python3-pip
          python3 -m pip install --user qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          qmk --version

      - name: Clone official vial-qmk
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          cd vial-qmk
          git submodule update --init --recursive

      - name: Copy my Atreus Vial keymap into vial-qmk
        run: |
          mkdir -p vial-qmk/keyboards/keyboardio/atreus/keymaps/vial
          cp config.h  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp rules.mk  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp keymap.c  vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/
          cp vial.json vial-qmk/keyboards/keyboardio/atreus/keymaps/vial/

      - name: Build keyboardio/atreus:vial
        run: |
          cd vial-qmk
          make keyboardio/atreus:vial

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboardio_atreus_vial_firmware
          path: |
            vial-qmk/*.hex
            vial-qmk/*.bin
